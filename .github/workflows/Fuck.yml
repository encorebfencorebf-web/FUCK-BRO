name: Pin Libs Test

on:
  workflow_dispatch:
    inputs:
      pin_date:
        description: "Tanggal pin (YYYY-MM-DD)"
        required: true
        default: "2024-02-01"

jobs:
  pin:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install haxelib libs
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp --quiet
          haxelib install openfl 9.2.2 --quiet
          haxelib install lime 8.1.2 --quiet
          haxelib install hxvlc 1.9.3 --quiet

      - name: Pin git libraries by date
        run: |
          PIN_DATE="${{ inputs.pin_date }}"
          pin() {
            git clone --quiet "$2" "/tmp/$1"
            SHA=$(git -C "/tmp/$1" rev-list -n 1 --before="$PIN_DATE" HEAD)
            echo "PIN $1 -> $SHA"
            haxelib git "$1" "$2" "$SHA"
          }
          pin extension-androidtools https://github.com/MAJigsaw77/extension-androidtools
          pin flixel https://github.com/CodenameCrew/cne-flixel
          pin flixel-addons https://github.com/CodenameCrew/cne-flixel-addons
          pin hscript-improved https://github.com/CodenameCrew/hscript-improved

      - name: Show result
        run: |
          haxe -version
          haxelib list
